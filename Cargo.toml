# atoms-rs — Quantum Physics & Molecular Research Framework

[workspace]
members = [
    "crates/atoms-core",
    "crates/atoms-numerics",
    "crates/atoms-orbitals",
    "crates/atoms-interactions",
    "crates/atoms-molecule",
    "crates/atoms-chemistry",
    "crates/atoms-gpu",
    "crates/atoms-render",
    "crates/atoms-io",
    "crates/atoms-python",
    "apps/atoms-viewer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anton-feldmann/atom-rs"
authors = ["Anton Feldmann <anton@nousresearch.com>"]

# Minimal workspace-level dependencies for cross-crate compilation
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
nalgebra = "0.32"
rayon = "1.8"
wgpu = "0.20"
pyo3 = { version = "0.21", features = ["extension-module"] }
eframe = "0.28"
egui_extras = "0.28"

[profile.release]
lto = true
codegen-units = 1
