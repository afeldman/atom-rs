[package]
name = "atoms-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 Python bindings for the atoms library (M2)"

[lib]
name = "atoms_python"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
nalgebra = { workspace = true }
atoms-core = { path = "../atoms-core" }
atoms-orbitals = { path = "../atoms-orbitals" }

# PyO3 is behind a feature so that `cargo test --workspace` does not require a
# Python toolchain. The extension module is built with `--features python`.
pyo3 = { workspace = true, optional = true }

[features]
default = []
python = ["dep:pyo3"]
