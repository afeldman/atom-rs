[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "atoms"
description = "Hydrogen-like quantum orbitals, densities and sampling (Rust core, Python API)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["quantum", "physics", "orbitals", "hydrogen", "scientific"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.22"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.22"]
scipy = ["scipy>=1.10"]

[project.urls]
Repository = "https://github.com/anton-feldmann/atom-rs"

[tool.maturin]
# Mixed Rust/Python layout: the extension module is `atoms._atoms` and the
# public API, including pure-Python conveniences, lives in `python/atoms/`.
python-source = "python"
module-name = "atoms._atoms"
features = ["python"]
