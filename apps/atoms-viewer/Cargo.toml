[package]
name = "atoms-viewer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Interactive 3D orbital and molecule viewer (M2)"

[[bin]]
name = "atoms-viewer"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
nalgebra = { workspace = true }
atoms-core = { path = "../../crates/atoms-core" }
atoms-orbitals = { path = "../../crates/atoms-orbitals" }

# The GUI stack is behind a feature so that `cargo test --workspace` stays cheap
# and headless-friendly. The application binary is built with `--features viewer`.
eframe = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[features]
default = []
viewer = ["dep:eframe", "dep:egui_extras"]
gpu = ["dep:wgpu"]

[package.metadata.docs.rs]
features = ["viewer"]
